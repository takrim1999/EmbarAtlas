<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142c31"/>
      <stop offset="60%" stop-color="#0b1a1d"/>
      <stop offset="100%" stop-color="#060f11"/>
    </radialGradient>

    <!-- Flame Primary Gradient -->
    <linearGradient id="flameGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffab73"/>
      <stop offset="35%" stop-color="#f0834e"/>
      <stop offset="70%" stop-color="#df5c2c"/>
      <stop offset="100%" stop-color="#b83818"/>
    </linearGradient>

    <!-- Microgravity Core Droplet Gradient -->
    <radialGradient id="dropletGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f7f2"/>
      <stop offset="45%" stop-color="#7ee8c8"/>
      <stop offset="85%" stop-color="#3b968a"/>
      <stop offset="100%" stop-color="#184e49"/>
    </radialGradient>

    <!-- Outer Glow Filter -->
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropletGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Orbital Instrument Reticle (Microgravity Theme) -->
  <circle cx="256" cy="270" r="185" fill="none" stroke="rgba(126, 232, 200, 0.12)" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="rgba(255, 171, 115, 0.1)" stroke-width="1.2"/>
  <ellipse cx="256" cy="270" rx="205" ry="75" fill="none" stroke="rgba(126, 232, 200, 0.18)" stroke-width="1.5" transform="rotate(-24 256 270)"/>

  <!-- Flame Silhouette (Main Vector) -->
  <g filter="url(#flameGlow)">
    <path d="M256 70 C280 145, 345 205, 345 285 A90 90 0 0 1 167 285 C167 235, 195 195, 225 155 C233 145, 238 125, 235 105 C234 95, 236 82, 256 70 Z" 
          fill="url(#flameGrad)" />
  </g>

  <!-- Inner Flame Tongue -->
  <path d="M256 145 C272 195, 310 235, 310 285 A54 54 0 0 1 202 285 C202 250, 222 222, 240 195 C246 186, 248 170, 246 158 C246 150, 248 142, 256 145 Z" 
        fill="#ffc599" opacity="0.6"/>

  <!-- Microgravity Quiescent Droplet Core -->
  <g filter="url(#dropletGlow)">
    <circle cx="256" cy="295" r="38" fill="url(#dropletGrad)"/>
    <circle cx="256" cy="295" r="38" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <!-- Specular highlight on droplet -->
    <ellipse cx="244" cy="282" rx="10" ry="6" fill="#ffffff" opacity="0.85" transform="rotate(-25 244 282)"/>
  </g>

  <!-- Microgravity Soot Ring Orbit -->
  <ellipse cx="256" cy="295" rx="58" ry="18" fill="none" stroke="rgba(255, 200, 160, 0.45)" stroke-width="2" stroke-dasharray="4 4" transform="rotate(15 256 295)"/>
</svg>
