name: Build and Push Container Image to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/test.yml'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: takrim1999/nasa-app

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger GitOps Image Tag Update
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
        run: |
          gh workflow run update-image.yml \
            --repo parthokr/oci-k8s \
            -f overlay="nasa-app-prod" \
            -f image="ghcr.io/takrim1999/nasa-app" \
            -f tag="sha-${GITHUB_SHA}"
